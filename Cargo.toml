[workspace]
members = [
  "crates/net",
  "crates/html-parser",
  "crates/css-parser",
  "crates/layout",
  "crates/app",
  "crates/js-bindings"
]
resolver = "2"

[workspace.dependencies]
iced = { version = "0.13", features = ["canvas", "tokio", "advanced"] }
tokio = { version = "1", features = ["full"] }
